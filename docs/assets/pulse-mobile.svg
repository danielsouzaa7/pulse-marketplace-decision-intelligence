<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 540" width="400" height="540" role="img" aria-labelledby="t d">
  <title id="t">Pulse — o motor calcula, o modelo explica</title>
  <desc id="d">A média da empresa fica dentro da faixa esperada enquanto a zona 7 sai dela. O motor detecta e ordena as prioridades: zona 7, toda a empresa, zona 4. Só depois da fronteira de evidência o modelo de linguagem escreve a explicação. Dados sintéticos.</desc>
  <style>
    .f { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .brand { font-size: 21px; font-weight: 700; fill: #E6EDF7; }
    .rule  { font-size: 15px; font-weight: 500; fill: #9FB0C8; }
    .chip  { font-size: 17px; font-weight: 600; fill: #E6EDF7; }
    .num   { font-size: 17px; font-weight: 700; fill: #4C7DFF; }
    .small { font-size: 13px; fill: #6F83A3; }
    .leg   { font-size: 14px; fill: #9FB0C8; }
    .alert { font-size: 15px; font-weight: 600; fill: #F85149; }
    .stg   { font-size: 15px; font-weight: 600; fill: #9FB0C8; }
    .stgv  { font-size: 15px; font-weight: 600; fill: #BC8CFF; }

    .anim { animation-duration: 12s; animation-iteration-count: infinite; animation-timing-function: linear; }
    .ping { transform-box: fill-box; transform-origin: center; }
    .cover { animation-name: cover; } .scan { animation-name: scan; }
    .mark { animation-name: mark; } .markp { animation-name: markp; }
    .c1 { animation-name: c1; } .c2 { animation-name: c2; } .c3 { animation-name: c3; }
    .rail { animation-name: rail; } .tint { animation-name: tint; }
    .g1 { animation-name: g1; } .g2 { animation-name: g2; } .g3 { animation-name: g3; }

    @keyframes cover { 0% { transform: translateX(0); opacity: 1; } 30% { transform: translateX(358px); opacity: 1; } 30.1%, 100% { transform: translateX(358px); opacity: 0; } }
    @keyframes scan  { 0% { transform: translateX(0); opacity: 1; } 30% { transform: translateX(352px); opacity: 1; } 32%, 100% { transform: translateX(352px); opacity: 0; } }
    @keyframes mark  { 0%, 25.9% { opacity: 0; } 26%, 94% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes markp { 0%, 25.9% { opacity: 0; transform: scale(1); } 26% { opacity: .9; transform: scale(1); } 36%, 100% { opacity: 0; transform: scale(3); } }
    @keyframes c1 { 0%, 33% { opacity: 0; transform: translateY(8px); } 36%, 94% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; } }
    @keyframes c2 { 0%, 36% { opacity: 0; transform: translateY(8px); } 39%, 94% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; } }
    @keyframes c3 { 0%, 39% { opacity: 0; transform: translateY(8px); } 42%, 94% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; } }
    @keyframes rail { 0%, 50% { transform: translateX(0); opacity: 0; } 52% { opacity: 1; } 60% { transform: translateX(125px); } 72% { transform: translateX(260px); opacity: 1; } 78%, 100% { transform: translateX(260px); opacity: 0; } }
    @keyframes tint { 0%, 65.9% { fill: #4C7DFF; } 66%, 100% { fill: #A371F7; } }
    @keyframes g1 { 0%, 51% { opacity: .3; } 53%, 94% { opacity: 1; } 100% { opacity: .3; } }
    @keyframes g2 { 0%, 59% { opacity: .3; } 61%, 94% { opacity: 1; } 100% { opacity: .3; } }
    @keyframes g3 { 0%, 71% { opacity: .3; } 73%, 94% { opacity: 1; } 100% { opacity: .3; } }

    @media (prefers-reduced-motion: reduce) { .anim { animation: none !important; } .moving { display: none; } }
  </style>
  <defs>
    <clipPath id="chartM"><rect x="18" y="104" width="366" height="150"/></clipPath>
    <filter id="s5m" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>

  <rect x="0.5" y="0.5" width="399" height="539" rx="16" fill="#0B1220" stroke="#1E2A40"/>

  <path d="M34 30 L43 39 L34 48 L25 39 Z" fill="#4C7DFF"/>
  <text class="f brand" x="52" y="47">Pulse</text>
  <text class="f rule" x="24" y="78">O modelo não decide — explica</text>
  <text class="f rule" x="24" y="98">evidência já calculada.</text>

  <g fill="none" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <path stroke="#5B6B86" d="M24 180 L56 176 L88 183 L120 178 L152 185 L184 180 L216 184 L248 181 L280 187 L312 184 L344 190 L376 192"/>
    <path stroke="#E6EDF7" d="M24 168 L56 164 L88 171 L120 166 L152 173 L184 168 L216 174 L248 182"/>
    <path stroke="#F85149" d="M248 182 L280 200 L312 216 L344 228 L376 236"/>
  </g>
  <g clip-path="url(#chartM)" class="moving">
    <rect class="anim cover" x="24" y="104" width="360" height="150" fill="#0B1220" opacity="0"/>
  </g>

  <rect x="24" y="146" width="352" height="50" fill="#4C7DFF" fill-opacity=".08"/>
  <g stroke="#4C7DFF" stroke-opacity=".4" stroke-dasharray="4 5">
    <line x1="24" y1="146" x2="376" y2="146"/><line x1="24" y1="196" x2="376" y2="196"/>
  </g>
  <text class="f small" x="26" y="138">faixa esperada</text>
  <g class="moving"><line class="anim scan" x1="24" y1="110" x2="24" y2="250" stroke="#4C7DFF" stroke-width="2" opacity="0"/></g>

  <g class="anim mark">
    <circle cx="344" cy="228" r="5.5" fill="#F85149"/>
    <circle cx="344" cy="228" r="11" fill="none" stroke="#F85149" stroke-width="2"/>
    <text class="f alert" x="326" y="250" text-anchor="end">anomalia · zona 7</text>
  </g>
  <circle class="anim markp ping moving" cx="344" cy="228" r="11" fill="none" stroke="#F85149" stroke-width="2" opacity="0"/>

  <line x1="24" y1="274" x2="42" y2="274" stroke="#5B6B86" stroke-width="3" stroke-linecap="round"/>
  <text class="f leg" x="48" y="279">média da empresa</text>
  <line x1="196" y1="274" x2="214" y2="274" stroke="#E6EDF7" stroke-width="3" stroke-linecap="round"/>
  <text class="f leg" x="220" y="279">zona 7</text>
  <text class="f small" x="376" y="279" text-anchor="end">sintético</text>

  <g class="anim c1">
    <rect x="24" y="296" width="352" height="40" rx="10" fill="#131C2E" stroke="#4C7DFF" stroke-width="1.5"/>
    <text class="f num" x="42" y="322">1</text><text class="f chip" x="66" y="322">Zona 7</text>
  </g>
  <g class="anim c2">
    <rect x="24" y="344" width="352" height="40" rx="10" fill="#131C2E" stroke="#25324A" stroke-width="1.5"/>
    <text class="f num" x="42" y="370">2</text><text class="f chip" x="66" y="370">Toda a empresa</text>
  </g>
  <g class="anim c3">
    <rect x="24" y="392" width="352" height="40" rx="10" fill="#131C2E" stroke="#25324A" stroke-width="1.5"/>
    <text class="f num" x="42" y="418">3</text><text class="f chip" x="66" y="418">Zona 4</text>
  </g>

  <!-- a fronteira: o motor calcula de um lado, o modelo narra do outro -->
  <line x1="60" y1="474" x2="320" y2="474" stroke="#25324A" stroke-width="2"/>
  <line x1="256" y1="452" x2="256" y2="500" stroke="#A371F7" stroke-opacity=".6" stroke-width="2" stroke-dasharray="5 5"/>
  <text class="f stgv" x="256" y="444" text-anchor="middle">fronteira</text>

  <circle class="anim g1" cx="60"  cy="474" r="9" fill="#4C7DFF"/>
  <circle class="anim g2" cx="185" cy="474" r="9" fill="#3FB950"/>
  <circle class="anim g3" cx="320" cy="474" r="9" fill="#A371F7"/>
  <g class="f" text-anchor="middle">
    <text class="stg" x="60"  y="508">motor</text>
    <text class="stg" x="185" y="508">evidência</text>
    <text class="stgv" x="320" y="508">LLM</text>
  </g>

  <g class="moving">
    <g class="anim rail">
      <circle class="anim tint" cx="60" cy="474" r="6" filter="url(#s5m)" opacity=".75"/>
      <circle cx="60" cy="474" r="4" fill="#F0F6FC"/>
    </g>
  </g>
</svg>
